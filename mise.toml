[tools]
vite-plus = { version = "latest", postinstall = "vp env off" } # do not manage nodejs with vite-plus

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tasks.dev]
run = "vp dev"

[tasks."dev:instance"]
run = [
    "eval $(vp exec vite-plugin-dev-server-gateway env auto)",
    "vp dev"
]